version: 2

models:
  - name: dim_customers
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: country
        tests:
          - accepted_values:
              arguments:
                values: ['Ukraine', 'USA', 'Portugal', 'Australia', 'Unknown']

  - name: fct_orders
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
  
  - name: mart_monthly_revenue
    description: "Фінансовий звіт: агрегація доходу за місяцями."
    columns:
      - name: order_month
        tests:
          - not_null

  - name: mart_product_category_stats

  - name: mart_customer_loyalty

  - name: mart_daily_operations

  - name: mart_full_order_details